<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-cyan-950 flex min-h-screen flex flex-col">

    <!--Header-->
    <header class="bg-cyan-800 text-center shadow-md flex justify-center items-center h-12 border-b-2 border-sky-500">
        <h1 class="font-bold text-sky-500 tracking-wide text-2xl  ">Clima<span class="text-white">Tempo</span></h1>
    </header>
    <!--Header-->
        <!--Main-->
        <main class="flex-1 flex justify-center items-center p-4">


        <!-- Container do Card Principal -->
        <div class="w-full max-w-md bg-cyan-800/90 rounded-sm shadow-2xl border border-sky-500 p-6 backdrop-blur-md">

            <!-- Formulario de busca -->
              <form id="search-form" class="flex gap-2 mb-6">
                <input type="text"
                id="city-input"
                placeholder="Digite uma cidade"
                class="w-full px-4 py-2.5 rounded-xl bg-cyan-950 border border-sky-500 text-white placeholder-cyan-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all text-sm "
                required
                >
                <button type="submit" class="px-5 py-2.5 bg-sky-500 hover:bg-sky-600 cursor-pointer text white rounded-xl transition-all duration-200 focus:ring-2 focus:ring-sky-300 active:scale-95 text-sm">Buscar</button>
              </form>      
        
        <!-- Feedback de Status (Carregando / Erro) -->
         <div id="status-message" class="hidden text-center py-2 mb-4 text-sm font-medium rounded-lg"> </div>
        
         <!-- Área de Resultados do Clima -->
         <section id="weather-card" class="space-y-6">

        <!-- Temperatura e Cidade -->
        <div class="flex items-center justify-between border-b border-sky-500 pb-5">
            <div>
                <h2 id="city-name" class="text-xl text-white font bold">Rio de janeiro</h2>
                <p id="weather-desc" class="text-sm text-white captalize">Céu limpo</p>
            </div>
            <div class="text-right">
                <span id="temperature" class="text-white text-4xl font-extrabold">28°C</span>
            </div>
        </div>
            <!-- Grid de Detalhes (2 colunas) -->
             <div class=" grid grid-cols-2 gap-3 text-sm">

                <div class="p-3 rounded-xl border border-sky-500 bg-cyan-950">
                <p class="text-xl text-white font bold">Sensação Térmica</p>
                <p id="feels-like" class="text-xl text-white font-bold ">30°C</p>
                </div>

                <div class="p-3 rounded-xl border border-sky-500 bg-cyan-950" >
                    <p class="text-xl text-white font bold">Umidade</p>
                    <p id="humidity" class="text-xl text-white font-bold">65%</p>
                </div>

                <div class="p-3 rounded-xl border border-sky-500 bg-cyan-950">
                    <p class="text-xl text-white font bold">Vento</p>
                    <p id="wind-speed" class="text-xl text-white font-bold">12 Km/h</p>
                </div>

                <div class="p-3 rounded-xl border border-sky-500 bg-cyan-950">
                    <p class="text-xl text-white font bold">Pressão</p>
                    <p id="pressure" class="text-xl text-white font-bold">1013 hPa</p>
                </div>
             </div>
         </section>

        </div> <!-- Container do Card Principal -->
         
        </main><!--Main-->
              
    <script src="main.js"></script>
  </body>
</html>
